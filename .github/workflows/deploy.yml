name: 部署提醒系统

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 同步到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 2222 }}
          source: "."
          target: ${{ secrets.REMOTE_DIR || '/opt/reminder' }}
          strip_components: 0
          overwrite: true
          rm: false
          exclude: "node_modules,.git,.env,config.json,data.json,.playwright-mcp"

      - name: 重启服务
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 2222 }}
          script: |
            set -e
            APP_DIR="${{ secrets.REMOTE_DIR || '/opt/reminder' }}"
            cd "$APP_DIR"
            npm install --omit=dev
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi
            test -f .env || printf 'PORT=3333\nAPP_URL=http://49.235.172.214:3333\n' > .env
            export $(grep -v '^#' .env | xargs -d '\n' -r) || true
            PORT="${PORT:-3333}"
            pm2 delete reminder >/dev/null 2>&1 || true
            pm2 start server.js --name reminder --update-env --cwd "$APP_DIR"
            if [ -f feishu-ws.js ]; then
              pm2 delete reminder-feishu-ws >/dev/null 2>&1 || true
              pm2 start feishu-ws.js --name reminder-feishu-ws --update-env --cwd "$APP_DIR"
            fi
            pm2 save
            sleep 2
            curl -sf "http://127.0.0.1:${PORT}/api/health" | head -c 400
            echo
