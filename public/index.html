<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nudge</title>
<link rel="stylesheet" href="styles.css?v=4.1.10">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F766E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="login-screen">
  <form class="login-box" id="login-form" autocomplete="on">
    <div class="brand-mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </div>
    <h1>Nudge</h1>
    <p class="tagline">轻推一下，刚好想起</p>
    <div class="field"><label for="login-user">用户名</label><input id="login-user" name="username" autocomplete="username" placeholder="admin"></div>
    <div class="field"><label for="login-pass">密码</label><input id="login-pass" name="password" type="password" autocomplete="current-password" placeholder="******"></div>
    <button class="btn-primary btn-block" id="login-btn" type="submit">进入</button>
    <div class="login-error hidden" id="login-error"></div>
  </form>
</div>
<div id="app">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </div>
      <h1>Nudge</h1>
    </div>
    <span class="user-badge" id="user-label"></span>
    <button class="btn-icon" id="logout-btn" type="button" aria-label="退出">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>
  <main class="app-content" id="app-content"></main>
  <button class="fab" id="fab-add" type="button" aria-label="新增事项" title="新增">+</button>
  <nav class="tab-bar" id="tab-bar" aria-label="主导航">
    <button data-view="today" class="active" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>今日</button>
    <button data-view="events" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>清单</button>
    <button data-view="subscribe" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a8 8 0 0 1 8 8"/><path d="M4 4a15 15 0 0 1 15 15"/><circle cx="5" cy="19" r="1"/></svg>订阅</button>
    <button data-view="settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>设置</button>
  </nav>
</div>
<script src="app.js?v=4.1.7"></script>
</body>
</html>
