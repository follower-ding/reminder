<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日常提醒系统</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8856b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root { --primary: #e8856b; --primary-dark: #d46a4f; --bg: #f8f4f0; --card: #fff; --text: #3a2a24; --text2: #8a7a74; --border: #e8ddd8; --shadow: 0 1px 4px rgba(0,0,0,.08); --radius: 10px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
a { color: var(--primary); text-decoration: none; }
button { cursor: pointer; font-family: inherit; font-size: inherit; border: none; border-radius: 8px; padding: 8px 16px; transition: opacity .2s; }
button:hover { opacity: .85; }
input, select, textarea { font-family: inherit; font-size: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; background: var(--card); color: var(--text); width: 100%; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(232,133,107,.2); }
textarea { resize: vertical; min-height: 60px; }
select { appearance: auto; }
h1 { font-size: 1.4rem; font-weight: 600; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
.hidden { display: none !important; }
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.login-box { background: var(--card); border-radius: 16px; padding: 40px 32px; width: 100%; max-width: 360px; box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center; }
.login-box h1 { font-size: 1.5rem; margin-bottom: 4px; }
.login-box p { color: var(--text2); font-size: .9rem; margin-bottom: 24px; }
.login-box .field { margin-bottom: 14px; text-align: left; }
.login-box .field label { display: block; font-size: .85rem; color: var(--text2); margin-bottom: 4px; }
.login-box .btn-primary { width: 100%; padding: 12px; background: var(--primary); color: #fff; font-size: 1rem; font-weight: 500; border-radius: 10px; margin-top: 8px; }
.login-error { color: #e74c3c; font-size: .85rem; margin-top: 8px; }
#app { display: none; min-height: 100vh; }
.app-header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
.app-header h1 { font-size: 1.1rem; flex: 1; }
.app-header .user-badge { font-size: .8rem; color: var(--text2); }
.app-header .btn-icon { background: none; padding: 6px; font-size: 1.2rem; border-radius: 8px; }
.app-header .btn-icon:hover { background: var(--bg); }
.app-content { padding: 16px; max-width: 800px; margin: 0 auto; padding-bottom: 80px; }
.tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 100; backdrop-filter: blur(10px); }
.tab-bar button { flex: 1; background: none; padding: 8px 4px; font-size: .7rem; color: var(--text2); display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 0; }
.tab-bar button .tab-icon { font-size: 1.3rem; }
.tab-bar button.active { color: var(--primary); }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.card-header h2 { font-size: 1rem; }
.stat-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.stat-item { text-align: center; padding: 12px; background: var(--bg); border-radius: 8px; }
.stat-item .num { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
.stat-item .label { font-size: .78rem; color: var(--text2); margin-top: 2px; }
.event-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.event-item:last-child { border-bottom: none; }
.event-icon { font-size: 1.5rem; width: 36px; text-align: center; flex-shrink: 0; }
.event-info { flex: 1; min-width: 0; }
.event-info .name { font-weight: 500; }
.event-info .meta { font-size: .8rem; color: var(--text2); margin-top: 2px; }
.event-info .message { font-size: .85rem; color: var(--primary); margin-top: 2px; }
.event-actions { display: flex; gap: 6px; flex-shrink: 0; }
.event-actions button { padding: 4px 10px; font-size: .8rem; background: var(--bg); border-radius: 6px; }
.event-actions .btn-d { color: #e74c3c; }
.event-actions .btn-e { color: var(--primary); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .72rem; background: var(--bg); color: var(--text2); }
.badge.active { background: #e8f5e9; color: #2e7d32; }
.badge.today { background: #fce4ec; color: #c62828; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: .85rem; color: var(--text2); margin-bottom: 4px; font-weight: 500; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-actions { display: flex; gap: 10px; margin-top: 16px; }
.form-actions button { flex: 1; }
.btn-primary { background: var(--primary); color: #fff; font-weight: 500; }
.btn-secondary { background: var(--bg); color: var(--text); }
.btn-danger { background: #fce4ec; color: #c62828; }
.btn-small { padding: 4px 12px; font-size: .8rem; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; z-index: 200; padding: 0; }
.modal-overlay.center { align-items: center; }
.modal-content { background: var(--card); border-radius: 16px 16px 0 0; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 20px; animation: slideUp .25s ease; }
.modal-overlay.center .modal-content { border-radius: 16px; margin: 20px; max-height: 90vh; }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h2 { font-size: 1.1rem; }
.modal-close { background: none; font-size: 1.4rem; padding: 4px 8px; color: var(--text2); }
.rec-item { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.rec-item:last-child { border-bottom: none; }
.rec-item .icon { font-size: 1.2rem; }
.rec-item .body { flex: 1; }
.rec-item .body .title { font-weight: 500; font-size: .9rem; }
.rec-item .body .desc { font-size: .82rem; color: var(--text2); }
.history-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .85rem; display: flex; gap: 10px; }
.history-item:last-child { border-bottom: none; }
.history-item .h-date { color: var(--text2); white-space: nowrap; font-size: .78rem; }
.config-section { margin-bottom: 20px; }
.config-section h3 { margin-bottom: 10px; font-size: .95rem; color: var(--text2); }
.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
.toggle { position: relative; width: 44px; height: 24px; background: #ddd; border-radius: 12px; transition: background .2s; cursor: pointer; flex-shrink: 0; }
.toggle.on { background: var(--primary); }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: transform .2s; }
.toggle.on::after { transform: translateX(20px); }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
.empty-state p { font-size: .9rem; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: .85rem; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (min-width: 640px) { .app-content { padding: 24px; } .stat-grid { grid-template-columns: repeat(4,1fr); } }
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="login-screen">
  <div class="login-box">
    <h1>☀️ 日常提醒</h1>
    <p>登录以管理您的提醒</p>
    <div class="field"><label>用户名</label><input type="text" id="login-user" placeholder="admin" autocomplete="username"></div>
    <div class="field"><label>密码</label><input type="password" id="login-pass" placeholder="******" autocomplete="current-password"></div>
    <button class="btn-primary" id="login-btn">登录</button>
    <div class="login-error hidden" id="login-error"></div>
  </div>
</div>
<div id="app">
  <div class="app-header">
    <span style="font-size:1.3rem">☀️</span>
    <h1>日常提醒</h1>
    <span class="user-badge" id="user-label"></span>
    <button class="btn-icon" id="logout-btn" title="退出登录">↩</button>
  </div>
  <div class="app-content" id="app-content"></div>
  <nav class="tab-bar" id="tab-bar">
    <button data-view="dashboard" class="active"><span class="tab-icon">📊</span>首页</button>
    <button data-view="events"><span class="tab-icon">📋</span>事件</button>
    <button data-view="stats"><span class="tab-icon">📈</span>统计</button>
    <button data-view="recommend"><span class="tab-icon">💡</span>推荐</button>
    <button data-view="settings"><span class="tab-icon">⚙️</span>设置</button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
